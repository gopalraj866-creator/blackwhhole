<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Hole Simulator – Technical Talk India</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#e8edf7; --dim:#7f8aa3; --faint:#4b556b; --amber:#ffb454; --cyan:#6fd3ff; --green:#8fe3a0; --violet:#b9a2ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; color:var(--ink);
    font-family:"Inter","Segoe UI","DejaVu Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; cursor:grab; }
  canvas#gl:active { cursor:grabbing; }
  svg#overlay { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; }
  svg#overlay text { font-size:12px; fill:#cfd8ea; letter-spacing:.02em; paint-order:stroke; stroke:#000; stroke-width:3px; }
  svg#overlay text.sub { fill:#7f8aa3; font-size:10.5px; }
  svg#overlay .ln { stroke:#8aa0c8; stroke-width:1; opacity:.8; fill:none; }
  svg#overlay .ring { stroke:#6fd3ff; stroke-width:1; stroke-dasharray:4 5; fill:none; opacity:.75; }
  svg#overlay .dot { fill:#cfd8ea; }
  .hidden { display:none !important; }

  #title { position:fixed; left:28px; top:24px; pointer-events:none; text-shadow:0 0 14px #000; }
  #title h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  #title p { margin:5px 0 0; font-size:11.5px; color:var(--dim); letter-spacing:.06em; }
  #brand { position:fixed; right:28px; top:26px; font-size:11px; letter-spacing:.22em; color:var(--faint);
    text-transform:uppercase; pointer-events:none; }

  /* data panel */
  #data { position:fixed; right:20px; top:52px; width:318px; max-height:calc(100vh - 66px); overflow:auto;
    padding:2px 2px 2px 14px; font-size:11px; line-height:1.32; border-left:1px solid #1c2233;
    background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.55)); scrollbar-width:none; }
  #data::-webkit-scrollbar { display:none; }
  #data h3 { margin:10px 0 4px; font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  #data h3:first-child { margin-top:2px; }
  #data h3 small { display:block; margin-top:2px; font-size:10px; font-weight:400; letter-spacing:.02em;
    text-transform:none; color:var(--faint); }
  #data .m h3 { color:var(--green); } #data .d h3 { color:var(--cyan); } #data .s h3 { color:var(--amber); }
  #data .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  #data .row span:first-child { color:var(--dim); }
  #data .row b { font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
  #data .src { display:block; color:var(--faint); font-size:9.5px; margin:-1px 0 3px; text-align:right; line-height:1.25; }
  #data .note { color:#8a93a8; font-size:10px; margin-top:5px; line-height:1.3; }
  #data .live b { color:var(--amber); }

  /* controls */
  #bar { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:flex; gap:6px; align-items:center;
    padding:8px 10px; border-radius:12px; background:rgba(8,10,16,.72); border:1px solid #1b2232;
    backdrop-filter:blur(8px); font-size:12px; transition:opacity .5s; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  #bar.dim { opacity:0; } #bar:hover { opacity:1; }
  body.withdata #bar { left:calc((100% - 340px) / 2); }
  body.withdata #hint { left:calc((100% - 340px) / 2); }
  #bar button, #bar select { background:#10141f; color:var(--ink); border:1px solid #232b3f; border-radius:8px;
    padding:6px 10px; font:inherit; cursor:pointer; }
  #bar button:hover, #bar select:hover { border-color:#3a4766; }
  #bar button.on { background:#1d2740; border-color:#4a6fb5; color:#fff; }
  #bar label { display:flex; align-items:center; gap:6px; color:var(--dim); padding:0 6px; }
  #bar input[type=range] { width:96px; accent-color:#5b8def; }
  #bar .sep { width:1px; height:22px; background:#1f2638; margin:0 4px; }
  #hint { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); font-size:11px; color:var(--faint);
    letter-spacing:.06em; pointer-events:none; transition:opacity 1s; text-align:center; }
  #fps { position:fixed; left:28px; bottom:20px; font-size:10.5px; color:var(--faint); pointer-events:none; }
  body.manual #bar, body.manual #hint, body.manual #fps { display:none; }
  @media (max-width: 900px) {
    #title h1 { font-size:16px; } #title p { font-size:10px; } #brand { display:none; }
    #data { width:min(300px, 86vw); top:auto; bottom:84px; max-height:46vh; right:10px; }
    #bar { bottom:10px; } #bar input[type=range] { width:70px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg id="overlay"></svg>

<div id="title"><h1 id="bhName">Sagittarius A*</h1><p id="bhSub">Supermassive black hole · centre of the Milky Way</p></div>
<div id="brand">Technical Talk India</div>

<div id="data"></div>

<div id="hint">Drag to rotate · Scroll to zoom · L labels · D data · Space pause</div>
<div id="fps"></div>

<div id="bar">
  <select id="preset" title="Black hole">
    <option value="sgra">Sagittarius A*</option>
    <option value="m87">M87*</option>
  </select>
  <span class="sep"></span>
  <select id="view" title="Viewing angle">
    <option value="cinematic">View: cinematic (i ≈ 75°)</option>
    <option value="eht">View: EHT-like (i ≈ 30°)</option>
    <option value="face">View: face-on (i ≈ 5°)</option>
    <option value="edge">View: edge-on (i ≈ 88°)</option>
  </select>
  <span class="sep"></span>
  <label>Disk speed <input id="speed" type="range" min="0" max="4" step="0.05" value="1"><b id="speedV" style="color:#e8edf7;min-width:34px">1.0×</b></label>
  <label>Brightness <input id="bright" type="range" min="0.4" max="2.2" step="0.05" value="1"></label>
  <span class="sep"></span>
  <button id="bAuto" class="on" title="A">Auto-orbit</button>
  <button id="bLabels" class="on" title="L">Labels</button>
  <button id="bStars" class="on" title="S">Stars</button>
  <button id="bData" class="on" title="D">Data</button>
  <select id="quality" title="Render quality">
    <option value="low">Quality: low</option>
    <option value="med" selected>Quality: medium</option>
    <option value="high">Quality: high</option>
  </select>
</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
